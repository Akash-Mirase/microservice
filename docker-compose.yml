services:

  # ---------------- DATABASE ---------------- #

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: selfhealing
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      retries: 5

  # ---------------- REDIS ---------------- #

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # ---------------- KAFKA ---------------- #

  zookeeper:
   image: confluentinc/cp-zookeeper:7.4.0
   environment:
    ZOOKEEPER_CLIENT_PORT: 2181
   healthcheck:
     test: ["CMD", "nc", "-z", "localhost", "2181"]
     interval: 5s
     timeout: 5s
     retries: 10

  kafka:
   image: confluentinc/cp-kafka:7.4.0
   depends_on:
     zookeeper:
       condition: service_healthy
   ports:
      - "9092:9092"
   environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
   restart: always

  # ---------------- SERVICES ---------------- #

  auth-service:
    build: .
    command: node services/auth-service.js
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  user-service:
    build: .
    command: node services/user-service.js
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  order-service:
    build: .
    command: node services/order-service.js
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    restart: always

  payment-service:
    build: .
    command: node services/payment-service.js
    ports:
      - "4004:4004"
    restart: always

  notification-service:
    build: .
    command: node services/notification-service.js
    ports:
      - "4005:4005"
    depends_on:
      kafka:
        condition: service_started
    restart: always

  api-gateway:
    build: .
    command: node gateway/api-gateway.js
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - user-service
      - order-service
    restart: always

  # ---------------- MONITORING ---------------- #

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
