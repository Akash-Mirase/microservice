services:

  # ---------------- DATABASE ---------------- #

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: selfhealing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      retries: 5
    networks:
      - selfhealing-network

  # ---------------- REDIS ---------------- #

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - selfhealing-network

  # ---------------- KAFKA ---------------- #

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - selfhealing-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - selfhealing-network
    restart: always

  # ---------------- SERVICES ---------------- #

  auth-service:
    build: .
    command: node services/auth-service.js
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  user-service:
    build: .
    command: node services/user-service.js
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4002/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  order-service:
    build: .
    command: node services/order-service.js
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4003/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  payment-service:
    build: .
    command: node services/payment-service.js
    ports:
      - "4004:4004"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4004/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    networks:
      - selfhealing-network
    restart: always

  notification-service:
    build: .
    command: node services/notification-service.js
    ports:
      - "4005:4005"
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4005/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  api-gateway:
    build: .
    command: node gateway/api-gateway.js
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - user-service
      - order-service
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  monitoring-service:
    build: .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: node services/monitoring-service.js
    ports:
      - "4006:4006"
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service
      - notification-service
      - ml-service
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4006/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: always

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile.ml
    command: python app.py
    working_dir: /app/ml-service
    ports:
      - "5000:5000"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network
    restart: on-failure:5

  traffic-generator:
    build: .
    command: node services/traffic-generator.js
    depends_on:
      - order-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network

  # ---------------- MONITORING ---------------- #

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - selfhealing-network

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - selfhealing-network

  dashboard-ui:
    build: ./dashboard-ui
    ports:
      - "3000:3000"
    depends_on:
      - monitoring-service
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres-data:
  grafana-storage:
  prometheus-data:

networks:
  selfhealing-network:
